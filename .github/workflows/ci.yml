name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:public-content
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: nadi_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: nadi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nadi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python3 scripts/test-database.py
        env:
          TEST_DATABASE_URL: postgresql://nadi_test:synthetic_test_only@localhost:5432/nadi_test
